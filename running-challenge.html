<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>마라닉TV 30일 러닝 챌린지</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --yellow: #FFEB00;
            --black: #111111;
            --white: #FFFFFF;
            --red: #E0001A;
            --off-white: #F8F8F6;
            --mid: #E2E2E2;
            --muted: #888;
            --stamp-red: rgba(200, 0, 20, 0.9);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            background: var(--off-white);
            color: var(--black);
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
        }

        /* ── Hero ── */
        .hero {
            background: var(--yellow);
            padding: 44px 28px 0;
            position: relative;
        }
        .hero-label {
            font-size: 0.7rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: var(--red);
            text-transform: uppercase;
            margin-bottom: 18px;
        }
        .hero-title {
            font-size: 3.2rem;
            font-weight: 900;
            line-height: 1.425;
            color: var(--black);
            letter-spacing: -2px;
        }
        .hero-title span {
            display: block;
        }
        .hero-black-bar {
            background: var(--black);
            margin: 28px -28px 0;
            padding: 18px 28px;
        }
        .hero-black-bar p {
            color: var(--white);
            font-size: 0.9rem;
            font-weight: 700;
            line-height: 1.5;
        }
        .hero-black-bar p em {
            color: var(--yellow);
            font-style: normal;
        }

        /* ── Stats ── */
        .stats-section {
            background: var(--white);
            padding: 36px 28px 28px;
            border-bottom: 3px solid var(--black);
        }
        .stats-row {
            display: flex;
            gap: 0;
            margin-bottom: 28px;
        }
        .stat {
            flex: 1;
            padding-right: 20px;
            border-right: 2px solid var(--mid);
            margin-right: 20px;
        }
        .stat:last-child { border-right: none; margin-right: 0; padding-right: 0; }
        .stat-num {
            font-size: 3rem;
            font-weight: 900;
            color: var(--black);
            line-height: 1;
            letter-spacing: -2px;
        }
        .stat-lbl {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--muted);
            margin-top: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .pbar-wrap {
            height: 14px;
            background: var(--mid);
        }
        .pbar {
            height: 100%;
            background: var(--black);
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .pbar-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--muted);
            margin-top: 10px;
        }

        /* ── Section header ── */
        .sec-header {
            padding: 36px 28px 18px;
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--black);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ── Badge Row ── */
        .badge-row {
            display: flex;
            gap: 12px;
            padding: 0 28px 8px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .badge-row::-webkit-scrollbar { display: none; }
        .badge-item {
            flex: 0 0 80px;
            background: var(--white);
            border: 2.5px solid var(--mid);
            padding: 16px 6px 13px;
            text-align: center;
            transition: transform 0.15s;
        }
        .badge-item.unlocked {
            background: var(--yellow);
            border-color: var(--black);
        }
        .badge-item.locked { opacity: 0.28; }
        .badge-icon { font-size: 2rem; display: block; margin-bottom: 6px; }
        .badge-name { font-size: 0.65rem; font-weight: 700; color: var(--black); line-height: 1.4; }
        .badge-item.locked .badge-name { color: var(--muted); }

        /* ── Medal box ── */
        .medal-box {
            display: none;
            margin: 0 28px 8px;
            background: var(--black);
            padding: 36px 28px;
            text-align: center;
            color: var(--white);
        }
        .medal-box.show {
            display: block;
            animation: medal-in 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }
        @keyframes medal-in {
            from { transform: scale(0.6) translateY(-20px); opacity: 0; }
            to   { transform: scale(1) translateY(0); opacity: 1; }
        }
        .medal-big {
            font-size: 5rem;
            display: block;
            margin-bottom: 16px;
            animation: medal-bounce 0.9s ease-out 0.4s both;
        }
        @keyframes medal-bounce {
            0%   { transform: scale(0) rotate(-15deg); }
            55%  { transform: scale(1.18) rotate(4deg); }
            80%  { transform: scale(0.94) rotate(-1deg); }
            100% { transform: scale(1) rotate(0); }
        }
        .medal-title {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--yellow);
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }
        .medal-sub {
            font-size: 0.95rem;
            line-height: 1.75;
            opacity: 0.88;
        }

        /* ── Week accordion ── */
        .week-wrap { margin: 0 0 3px; }
        .week-head {
            background: var(--black);
            padding: 20px 28px;
            display: flex;
            align-items: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            transition: opacity 0.15s;
        }
        .week-head:active { opacity: 0.85; }
        .week-icon { font-size: 1.3rem; margin-right: 12px; flex-shrink: 0; }
        .week-title-text {
            font-weight: 900;
            font-size: 1.05rem;
            color: var(--white);
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.3px;
        }
        .week-done-tag {
            font-size: 0.62rem;
            font-weight: 900;
            background: var(--yellow);
            color: var(--black);
            padding: 3px 9px;
            letter-spacing: 0.5px;
            display: none;
        }
        .week-done-tag.show {
            display: inline-block;
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop {
            0%   { transform: scale(0); }
            65%  { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        .week-prog {
            font-size: 0.82rem;
            font-weight: 700;
            color: rgba(255,255,255,0.55);
            margin-right: 12px;
        }
        .chevron {
            color: rgba(255,255,255,0.5);
            font-size: 0.75rem;
            transition: transform 0.25s;
        }
        .chevron.open { transform: rotate(180deg); }
        .week-body {
            background: var(--white);
            border-left: 3px solid var(--black);
            border-right: 3px solid var(--black);
        }

        /* ── Day card ── */
        .day-card {
            display: flex;
            align-items: center;
            padding: 20px 20px 20px 0;
            gap: 16px;
            border-bottom: 1.5px solid var(--mid);
            position: relative;
            min-height: 84px;
            border-left: 6px solid var(--black);
        }
        .day-card.rest { border-left-color: var(--yellow); }
        .day-card.done { background: #FFFEF0; }
        .day-card.rest.done { background: #FFFEF0; }
        .day-card:last-child { border-bottom: none; }

        .day-num {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 0.9rem;
            flex-shrink: 0;
            margin-left: 16px;
        }

        .day-info { flex: 1; min-width: 0; }
        .day-type {
            font-size: 0.68rem;
            font-weight: 900;
            color: var(--muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .day-workout {
            font-size: 0.92rem;
            font-weight: 600;
            line-height: 1.5;
            color: var(--black);
        }

        /* ── Button ── */
        .action-btn {
            flex-shrink: 0;
            border: 2.5px solid var(--black);
            background: var(--black);
            color: var(--white);
            padding: 10px 14px;
            font-size: 0.78rem;
            font-weight: 900;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.12s;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
            letter-spacing: 0.3px;
            margin-right: 20px;
        }
        .action-btn.rest-btn {
            background: var(--yellow);
            color: var(--black);
            border-color: var(--black);
        }
        .action-btn:hover { opacity: 0.8; }
        .action-btn:active { transform: scale(0.96); }

        /* ── Stamp ── */
        .stamp {
            flex-shrink: 0;
            transform: rotate(-12deg);
            margin-right: 20px;
        }
        .stamp.fresh {
            animation: stamp-hit 0.38s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }
        @keyframes stamp-hit {
            0%   { transform: rotate(-12deg) scale(2.5); opacity: 0; }
            45%  { transform: rotate(-12deg) scale(0.85); opacity: 1; }
            70%  { transform: rotate(-12deg) scale(1.1); }
            100% { transform: rotate(-12deg) scale(1); opacity: 1; }
        }
        .stamp-body {
            border: 2.5px solid var(--stamp-red);
            padding: 6px 10px;
            position: relative;
            color: var(--stamp-red);
            text-align: center;
            background: rgba(255,255,255,0.7);
        }
        .stamp-body::before {
            content: '';
            position: absolute;
            inset: 3px;
            border: 1px solid rgba(200,0,20,0.2);
        }
        .stamp-star { font-size: 1.1rem; line-height: 1.1; }
        .stamp-text {
            font-size: 0.6rem;
            font-weight: 900;
            letter-spacing: 1px;
            line-height: 1.5;
            margin-top: 2px;
        }

        /* ── Video section ── */
        .videos-grid {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding: 0 28px;
        }
        .video-card {
            background: var(--white);
            border: 2.5px solid var(--black);
            overflow: hidden;
        }
        .video-thumb-wrap {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            cursor: pointer;
            background: #000;
        }
        .video-thumb-wrap img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.88;
            transition: opacity 0.2s;
        }
        .video-thumb-wrap:hover img { opacity: 0.72; }
        .video-thumb-wrap iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .play-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .play-btn-circle {
            width: 60px;
            height: 60px;
            background: var(--yellow);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s;
        }
        .video-thumb-wrap:hover .play-btn-circle { transform: scale(1.08); }
        .play-arrow {
            width: 0; height: 0;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-left: 20px solid var(--black);
            margin-left: 5px;
        }
        .video-meta { padding: 14px 16px 16px; }
        .video-label {
            font-size: 0.66rem;
            font-weight: 900;
            color: var(--red);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
        }
        .video-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--black);
            line-height: 1.4;
        }
        .video-channel {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 4px;
            font-weight: 600;
        }

        /* ── Reset ── */
        .reset-section {
            text-align: center;
            padding: 36px 28px 16px;
        }
        .reset-btn {
            background: none;
            border: 2px solid var(--mid);
            padding: 10px 24px;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--muted);
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
            letter-spacing: 0.3px;
        }
        .reset-btn:hover { border-color: var(--black); color: var(--black); }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(90px);
            background: var(--black);
            color: var(--yellow);
            padding: 13px 26px;
            font-size: 0.92rem;
            font-weight: 900;
            z-index: 1000;
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.25s;
            opacity: 0;
            white-space: nowrap;
            pointer-events: none;
            letter-spacing: 0.3px;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ── Confetti ── */
        .confetti-layer {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 999;
            overflow: hidden;
        }
        .cf {
            position: absolute;
            top: -20px;
            animation: cf-drop linear forwards;
        }
        @keyframes cf-drop {
            to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        .weeks-container {
            padding: 0 28px;
        }

        .spacer { height: 56px; }
    </style>
</head>

    catch { return {}; }
})();
let openWeeks = new Set();

const weekDays = w => PROGRAM.filter(d => d.week === w);
const isWeekDone = w => weekDays(w).every(d => done[d.day]);
const totalDone = () => PROGRAM.filter(d => done[d.day]).length;
const save = () => localStorage.setItem(KEY, JSON.stringify(done));

function updateStats() {
    const n = totalDone();
    const pct = Math.round(n / 30 * 100);
    document.getElementById('cnt-done').textContent = n;
    document.getElementById('cnt-pct').textContent = pct + '%';
    document.getElementById('cnt-left').textContent = 30 - n;
    document.getElementById('pbar').style.width = pct + '%';
    document.getElementById('pbar-label').textContent = n + ' / 30';
}

function renderBadges() {
    document.getElementById('badge-row').innerHTML = WEEKS.map(w => {
        const ok = isWeekDone(w);
        return `<div class="badge-item ${ok ? 'unlocked' : 'locked'}">
            <span class="badge-icon">${ok ? '🏅' : '🔒'}</span>
            <div class="badge-name">${w}주차<br>배지</div>
        </div>`;
    }).join('');
}

function buildDayCard(d, animate) {
    const isDone = !!done[d.day];
    const cls = ['day-card', d.rest ? 'rest' : '', isDone ? 'done' : ''].filter(Boolean).join(' ');
    const numStyle = isDone
        ? 'background:#111;color:#fff'
        : d.rest
        ? 'background:#FFEB00;color:#111;border:2px solid #111'
        : 'background:#111;color:#fff';
    const typeLabel = d.rest ? '휴식일' : '훈련일';

    let action;
    if (isDone) {
        action = `<div class="stamp${animate ? ' fresh' : ''}">
            <div class="stamp-body">
                <div class="stamp-star">⭐</div>
                <div class="stamp-text">참잘<br>했어요</div>
            </div>
        </div>`;
    } else {
        const btnLabel = d.rest ? '스트레칭 완료' : '오늘 달렸어요!';
        const btnCls = d.rest ? ' rest-btn' : '';
        action = `<button class="action-btn${btnCls}" onclick="completeDay(${d.day})">${btnLabel}</button>`;
    }

    return `<div class="${cls}" id="dc-${d.day}">
        <div class="day-num" style="${numStyle}">${d.day}</div>
        <div class="day-info">
            <div class="day-type">${typeLabel}</div>
            <div class="day-workout">${d.workout}</div>
        </div>
        ${action}
    </div>`;
}

function renderWeeks() {
    document.getElementById('weeks-root').innerHTML = WEEKS.map(w => {
        const days = weekDays(w);
        const doneN = days.filter(d => done[d.day]).length;
        const isOpen = openWeeks.has(w);
        const wDone = isWeekDone(w);

        return `<div class="week-wrap" id="ww-${w}">
            <div class="week-head${isOpen ? ' open' : ''}" onclick="toggleWeek(${w})">
                <span class="week-icon">${wDone ? '🏅' : '📅'}</span>
                <span class="week-title-text">
                    ${w}주차
                    <span class="week-done-tag${wDone ? ' show' : ''}">완료!</span>
                </span>
                <span class="week-prog">${doneN}/${days.length}</span>
                <span class="chevron${isOpen ? ' open' : ''}">▼</span>
            </div>
            ${isOpen ? `<div class="week-body">${days.map(d => buildDayCard(d, false)).join('')}</div>` : ''}
        </div>`;
    }).join('');
}

function toggleWeek(w) {
    openWeeks.has(w) ? openWeeks.delete(w) : openWeeks.add(w);
    renderWeeks();
}

function completeDay(dayNum) {
    const d = PROGRAM.find(x => x.day === dayNum);
    if (!d || done[dayNum]) return;

    const wasWeekDone = isWeekDone(d.week);
    done[dayNum] = true;
    save();

    const card = document.getElementById('dc-' + dayNum);
    if (card) card.outerHTML = buildDayCard(d, true);

    updateStats();
    syncWeekHeader(d.week);

    const nowWeekDone = isWeekDone(d.week);
    if (!wasWeekDone && nowWeekDone) {
        renderBadges();
        setTimeout(() => showToast(`🏅 ${d.week}주차 배지 획득!`), 300);
    } else {
        showToast('⭐ 참잘했어요!');
    }

    if (totalDone() === 30) {
        setTimeout(() => {
            const medal = document.getElementById('medal-box');
            medal.classList.add('show');
            medal.scrollIntoView({ behavior: 'smooth', block: 'center' });
            launchConfetti();
            setTimeout(() => showToast('🥇 30일 완주 메달 획득!'), 500);
        }, 700);
    }
}

function syncWeekHeader(w) {
    const wrap = document.getElementById('ww-' + w);
    if (!wrap) return;
    const days = weekDays(w);
    const doneN = days.filter(d => done[d.day]).length;
    const wDone = isWeekDone(w);
    const icon = wrap.querySelector('.week-icon');
    const prog = wrap.querySelector('.week-prog');
    const tag  = wrap.querySelector('.week-done-tag');
    if (icon) icon.textContent = wDone ? '🏅' : '📅';
    if (prog) prog.textContent = `${doneN}/${days.length}`;
    if (tag)  tag.classList.toggle('show', wDone);
}

function resetAll() {
    if (!confirm('처음부터 다시 시작하시겠어요? 모든 기록이 삭제됩니다.')) return;
    done = {};
    save();
    document.getElementById('medal-box').classList.remove('show');
    updateStats();
    renderBadges();
    openWeeks = new Set([1]);
    renderWeeks();
    showToast('↺ 처음부터 다시 시작!');
}

function loadVideo(wrapperId, videoId) {
    const wrap = document.getElementById(wrapperId);
    if (!wrap) return;
    wrap.innerHTML = `<iframe
        src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen></iframe>`;
}

let toastTimer = null;
function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

function launchConfetti() {
    const wrap = document.getElementById('confetti-layer');
    const COLORS = ['#FFEB00','#E0001A','#111111','#ffffff','#FFD700','#ff6600'];
    const SHAPES = ['●','■','▲','★','◆','▪'];
    for (let i = 0; i < 100; i++) {
        setTimeout(() => {
            const el = document.createElement('div');
            el.className = 'cf';
            el.style.cssText = `
                left: ${Math.random() * 100}vw;
                color: ${COLORS[~~(Math.random() * COLORS.length)]};
                font-size: ${Math.random() * 14 + 8}px;
                animation-duration: ${Math.random() * 2.5 + 2}s;
                animation-delay: ${Math.random() * 0.5}s;
            `;
            el.textContent = SHAPES[~~(Math.random() * SHAPES.length)];
            wrap.appendChild(el);
            setTimeout(() => el.remove(), 4500);
        }, i * 35);
    }
}

(function init() {
    updateStats();
    renderBadges();
    const firstIncomplete = WEEKS.find(w => !isWeekDone(w));
    openWeeks = new Set([firstIncomplete ?? 5]);
    renderWeeks();
    if (totalDone() === 30) document.getElementById('medal-box').classList.add('show');
})();
</script>
</body>
</html>
